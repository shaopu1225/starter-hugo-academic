{{ define "main" }}
  <article class="home-content">
    {{ .Content }}

  <section aria-labelledby="recent-writing">
    <h2 id="recent-writing">Recent writing</h2>
    {{ $posts := where site.RegularPages "Section" "post" }}

  </section>

    <h2 id="find-me">Find me online</h2>

      <li><a href="https://github.com/shaopu1225">GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/shaopu-song-626062153/">LinkedIn</a></li>
    </ul>
  </section>
{{ end }}
